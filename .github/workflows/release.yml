name: Release

# Push a tag like v0.2.0 to publish to npm and attach standalone binaries to a GitHub release.
#   pnpm version minor && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Optional: publishes to npm from CI. If you publish by hand (or NPM_TOKEN is not set) this job just
  # fails harmlessly and does not block the binaries and the GitHub release below.
  npm:
    needs: verify
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: aicommit-linux-x64 }
          - { os: macos-15-intel, name: aicommit-macos-x64 }
          - { os: macos-latest, name: aicommit-macos-arm64 }
          - { os: windows-latest, name: aicommit-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:binary
      - name: Rename
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then cp dist-bin/aicommit.exe "${{ matrix.name }}"; else cp dist-bin/aicommit "${{ matrix.name }}"; fi
          ./"${{ matrix.name }}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum aicommit-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
